[package]
name = "rlib-lint"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = { version = "=6.0.1", features = ["constituent"] }

[dev-dependencies]
dylint_testing = "=6.0.1"

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
