[package]
name = "rlib-lint"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["leptos_i18n"]
framework = []
bon = []
derive_more = ["framework", "dep:quote", "dep:syn"]
leptos = ["dep:leptosfmt-formatter", "dep:proc-macro2", "dep:quote", "dep:rstml", "dep:syn"]
leptos_i18n = ["leptos"]
leptos_styling = ["leptos", "dep:malva", "dep:raffia"]
miette = ["dep:syn"]
serde = ["dep:syn"]
strum = ["framework", "dep:syn"]
thiserror = ["framework", "dep:syn"]

[dependencies]
convert_case = "0.11"
dylint_linting = { version = "=6.0.1", features = ["constituent"] }
derive_more = { version = "=2.1.1", features = ["full"] }
heck = "0.5"
leptosfmt-formatter = { version = "=0.1.33", optional = true }
malva = { version = "=0.16.0", optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
quote = { version = "1", optional = true }
raffia = { version = "=0.12.0", optional = true }
rstml = { version = "=0.12.1", optional = true }
serde = { version = "1", features = ["derive"] }
strum = { version = "=0.28.0", features = ["derive"] }
syn = { version = "2", features = ["full", "parsing", "visit"], optional = true }
toml = "1.1"

[dev-dependencies]
bon = "=3.9.3"
dylint_testing = "=6.0.1"
leptos = { version = "=0.8.20", features = ["ssr"] }
miette = { version = "=7.6.0", features = ["derive"] }
reactive_stores = "=0.4.3"
thiserror = "=2.0.19"

