[package]
name = "rlib-lint"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["leptos"]
leptos = []

[dependencies]
convert_case = "0.11"
dylint_linting = { version = "=6.0.1", features = ["constituent"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
dylint_testing = "=6.0.1"
leptos = { version = "=0.8.20", features = ["ssr"] }
reactive_stores = "=0.4.3"

[[example]]
name = "boolean_component_props"
path = "ui/leptos/boolean_component_props/semantic.rs"
required-features = ["leptos"]

[[example]]
name = "writable_signal_component_props"
path = "ui/leptos/writable_signal_component_props/semantic.rs"
required-features = ["leptos"]

[[example]]
name = "leptos_manual_resource_refetch_signals"
path = "ui/leptos/leptos_manual_resource_refetch_signals/semantic.rs"
required-features = ["leptos"]

[[example]]
name = "leptos_reactive_writes_during_view_construction"
path = "ui/leptos/leptos_reactive_writes_during_view_construction/semantic.rs"
required-features = ["leptos"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
