[package]
name = "rlib-lint"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["leptos"]
framework = []
leptos = ["dep:proc-macro2", "dep:quote", "dep:rstml", "dep:syn"]
strum = ["framework"]

[dependencies]
convert_case = "0.11"
dylint_linting = { version = "=6.0.1", features = ["constituent"] }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
quote = { version = "1", optional = true }
rstml = { version = "=0.12.1", optional = true }
serde = { version = "1", features = ["derive"] }
syn = { version = "2", features = ["full", "parsing"], optional = true }
toml = "0.9"

[dev-dependencies]
derive_more = { version = "=2.1.1", features = ["is_variant"] }
dylint_testing = "=6.0.1"
leptos = { version = "=0.8.20", features = ["ssr"] }
reactive_stores = "=0.4.3"
strum = { version = "=0.28.0", features = ["derive"] }

[[example]]
name = "leptos_attribute_bound_controlled_inputs"
path = "ui/leptos/leptos_attribute_bound_controlled_inputs/semantic.rs"
required-features = ["leptos"]

