[package]
name = "rlib-lint"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
convert_case = "0.11"
dylint_linting = { version = "=6.0.1", features = ["constituent"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
dylint_testing = "=6.0.1"

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
