# Shared compiler policy for every fixture.
rustc-flags = [
    "-Zcrate-attr=feature(register_tool)",
    "-Zcrate-attr=register_tool(rlib)",
    "-A",
    "duplicate_features",
    "-A",
    "rlib::all",
]

# Direct rustc fixtures share one source inventory and a small explicit cross-fixture lint set.
core-rustc-flags = ["--edition=2024"]
core-lints = [
    "bool_fields_without_predicate_prefix",
    "collection_method_like_free_functions",
    "cross_file_struct_impls",
    "invalid_barrel_file_items",
    "method_like_free_functions",
    "mixed_module_file_layouts",
    "needless_function_wrappers",
    "non_adjacent_struct_impls",
]

# Every direct child directory of ui/core must appear here exactly once.
core = [
    "ad_hoc_collection_construction",
    "ad_hoc_conversions",
